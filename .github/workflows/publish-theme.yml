# Publishes themes from comments on the gallery issue (any issue labelled
# theme-gallery): a new or edited comment with the textus-theme template is
# validated and committed to themes/ and index.json on main; a deleted
# comment takes its theme down; `/remove <id>` lets the author or a
# maintainer take one down. The bot answers each comment with the result.
# See scripts/publish.mjs and scripts/lib/gallery.mjs.
#
# Run it by hand (Actions > Publish themes > Run workflow) to resync every
# gallery issue, e.g. after editing removed.json.
name: Publish themes

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One run at a time. GitHub keeps only the newest pending run, so a burst of
# comments can skip one - harmless, as every run reconciles all comments.
concurrency:
  group: publish-themes
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'theme-gallery') &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/publish.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
